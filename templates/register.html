<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Expense Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50
             flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-3xl shadow-xl p-8">

            <!-- Heading -->
            <div class="text-center mb-8">

                <div class="inline-flex items-center justify-center
                            w-14 h-14 rounded-2xl bg-blue-100 mb-4">

                    <span class="text-2xl">💰</span>

                </div>

                <h1 class="text-3xl font-bold text-gray-800">
                    Create Account
                </h1>

                <p class="text-gray-500 mt-2">
                    Start managing your expenses smarter
                </p>

            </div>


            <!-- Form -->
            <form method="POST" class="space-y-5">

                <!-- Username -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        minlength="3"
                        placeholder="Enter your username"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200
                               focus:outline-none focus:ring-2 focus:ring-blue-400
                               focus:border-transparent transition"
                    >

                </div>


                <!-- Email -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                        placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200
                               focus:outline-none focus:ring-2 focus:ring-blue-400
                               focus:border-transparent transition"
                    >

                </div>


                <!-- Password -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        minlength="6"
                        placeholder="Create a password"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200
                               focus:outline-none focus:ring-2 focus:ring-blue-400
                               focus:border-transparent transition"
                    >

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white font-semibold
                           py-3 rounded-xl shadow-md
                           hover:bg-blue-700 hover:shadow-lg
                           transition duration-200">

                    Create Account

                </button>

            </form>


            <!-- Small footer -->
            <p class="text-center text-sm text-gray-400 mt-6">
                Your password is securely hashed before being stored.
            </p>

        </div>

    </div>

</body>

</html>
