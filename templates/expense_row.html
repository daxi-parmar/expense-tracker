<tr id="expense-{{ expense._id }}" class="border-b border-gray-100 hover:bg-gray-50">

    <td class="px-4 py-3 text-sm text-gray-700">
        {{ expense.date }}
    </td>

    <td class="px-4 py-3 text-sm text-gray-700">
        {{ expense.item }}
    </td>

    <td class="px-4 py-3 text-sm text-gray-900 font-medium">
        ₹{{ "%.2f"|format(expense.price) }}
    </td>

    <td class="px-4 py-3">

        <button
            type="button"
            hx-get="/edit/{{ expense._id }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            class="bg-blue-500 text-white text-sm px-3 py-1 rounded-lg
                   hover:bg-blue-600">
            Edit
        </button>

        <button
            type="button"
            hx-delete="/delete/{{ expense._id }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to delete this expense?"
            class="bg-red-500 text-white text-sm px-3 py-1 rounded-lg
                   hover:bg-red-600">
            Delete
        </button>

    </td>

</tr>
