<tr id="expense-{{ expense._id }}" class="border-b border-gray-100">

    <td colspan="5" class="px-4 py-3">

        <form
            hx-post="/edit/{{ expense._id }}"
            hx-target="#expense-{{ expense._id }}"
            hx-swap="outerHTML"
            class="grid grid-cols-5 gap-3 items-center">

            <input
                type="date"
                name="date"
                value="{{ expense.date }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <input
                type="text"
                name="item"
                value="{{ expense.item }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <select
                name="category"
                required
                class="border border-gray-300 rounded-lg p-2">

                <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>
                    🍔 Food
                </option>

                <option value="Travel" {% if expense.category == "Travel" %}selected{% endif %}>
                    🚗 Travel
                </option>

                <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>
                    💡 Bills
                </option>

                <option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>
                    🛍️ Shopping
                </option>

                <option value="Entertainment" {% if expense.category == "Entertainment" %}selected{% endif %}>
                    🎬 Entertainment
                </option>

                <option value="Education" {% if expense.category == "Education" %}selected{% endif %}>
                    📚 Education
                </option>

                <option value="Health" {% if expense.category == "Health" %}selected{% endif %}>
                    💊 Health
                </option>

                <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>
                    📦 Other
                </option>

            </select>

            <input
                type="number"
                step="0.01"
                name="price"
                value="{{ expense.price }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <button
                type="submit"
                class="bg-green-500 text-white px-3 py-2 rounded-lg
                       hover:bg-green-600">
                Save
            </button>

        </form>

    </td>

</tr>
