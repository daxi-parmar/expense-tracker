<tr class="border-b border-gray-100">

    <td colspan="4" class="px-4 py-3">

        <form
           hx-post="/edit/{{ expense._id }}"
           hx-target="closest tr"
           hx-swap="outerHTML"
           class="grid grid-cols-4 gap-3 items-center">

            <input
                type="date"
                name="date"
                value="{{ expense.date }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <input
                type="text"
                name="item"
                value="{{ expense.item }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <input
                type="number"
                step="0.01"
                name="price"
                value="{{ expense.price }}"
                class="border border-gray-300 rounded-lg p-2"
            >

            <button
                type="submit"
                class="bg-green-500 text-white px-3 py-2 rounded-lg hover:bg-green-600">
                Save
            </button>

        </form>

    </td>

</tr>
