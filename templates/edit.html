<!DOCTYPE html>
<html>
    <head>
            <title>Edit Expense</title>
    </head>
    <body>
        <h1> EDIT EXPENSE </h1>
        <form action="/edit/{{ expense._id }}" method ="POST">
            <label for="date">Date:</label>
            <input type = "date" name = "date" value="{{ expense.date }}">
            <br><br>
            
            <label for="price">Price:</label>
            <input type ="number" step="0.01"  name ="price" value="{{ expense.price }}">
            <br><br>

            <label for="item">Item:</label>
            <input type ="text" name ="item" value="{{ expense.item }}">
            <br><br>

            <button type="submit"> save changes </button>

        </form>

    </body>
</html>
